<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Traslado Caravana</title>
  <link rel="manifest" href="./manifest_traslado.json">
  <meta name="theme-color" content="#2e7d32">
  <style>
    :root {
      --primary: #2e7d32;
      --primary-dark: #1b5e20;
      --bg: #f4f6f8;
      --card-bg: #ffffff;
      --text: #333333;
      --border: #cccccc;
      --danger: #d32f2f;
      --success: #388e3c;
      --warning: #f57c00;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 15px; max-width: 600px; margin: 0 auto; }

    header { background-color: var(--primary); color: white; padding: 15px; border-radius: 10px; text-align: center; margin-bottom: 15px; }
    header h1 { font-size: 1.4rem; margin-bottom: 5px; }

    .badge { display: inline-block; padding: 4px 8px; border-radius: 12px; font-size: 0.8rem; font-weight: bold; background: rgba(255,255,255,0.2); }

    .btn-install {
      display: none;
      background: #ffffff; color: var(--primary); border: none; padding: 8px 16px;
      border-radius: 20px; font-weight: bold; font-size: 0.85rem; cursor: pointer; margin-top: 10px;
    }

    .card { background: var(--card-bg); padding: 15px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); margin-bottom: 15px; }
    .form-group { margin-bottom: 12px; }
    label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 0.9rem; }
    input[type="text"] { width: 100%; padding: 12px; border: 2px solid var(--border); border-radius: 8px; font-size: 1rem; outline: none; }
    input[type="text"]:focus { border-color: var(--primary); }

    .btn-group { display: flex; gap: 10px; margin-top: 10px; }
    .btn { width: 100%; padding: 12px; background-color: var(--primary); color: white; border: none; border-radius: 8px; font-size: 1rem; font-weight: bold; cursor: pointer; }
    .btn-secondary { background-color: #666; }
    .btn-danger { background-color: var(--danger); }

    .status-bar { display: flex; justify-content: space-between; align-items: center; padding: 10px; background-color: #e8f5e9; border-left: 4px solid var(--success); border-radius: 6px; margin-bottom: 15px; font-size: 0.9rem; }
    .status-offline { background-color: #ffebee; border-left-color: var(--danger); }

    .sync-panel { background-color: #fff3e0; border-left: 4px solid var(--warning); padding: 12px; border-radius: 6px; margin-bottom: 15px; font-size: 0.9rem; display: flex; justify-content: space-between; align-items: center; }
    .list-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    ul.item-list { list-style: none; }
    ul.item-list li { background: #fafafa; border: 1px solid #eee; padding: 10px; border-radius: 6px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
    .empty-msg { text-align: center; color: #777; padding: 20px 0; font-size: 0.9rem; }
  </style>
</head>
<body>
  <span id="appVersion" aria-label="Versión 1.0" style="position:fixed;top:8px;right:10px;z-index:10000;padding:4px 8px;border-radius:12px;background:#fff;color:#1f4e78;border:1px solid #ccd7e3;font:700 12px system-ui;box-shadow:0 1px 4px #0002;">V 1.0</span>

  <header>
    <h1>Traslado Caravana</h1>
    <span class="badge" id="appStatus">PWA Web</span><br>
    <button class="btn-install" id="btnInstall">📲 Instalar Aplicación</button>
  </header>

  <div class="status-bar" id="netStatus">
    <span>Estado: <strong id="netText">En Línea</strong></span>
    <span id="syncText">Sincronizado</span>
  </div>

  <div class="sync-panel" id="syncPanel">
    <div><strong>Pendientes de envío:</strong> <span id="pendingCount">0</span></div>
    <button class="btn btn-secondary" id="btnSyncNow" style="width: auto; padding: 6px 14px; font-size: 0.85rem;">Sincronizar</button>
  </div>

  <div class="card">
    <div class="form-group">
      <label for="renspaInput">RENSPA Destino / referencia:</label>
      <input type="text" id="renspaInput" placeholder="Código RENSPA, Muerto u otro texto" autocomplete="off">
      <small>Se aplica a las siguientes caravanas hasta que lo cambies. Enter vuelve a la lectura del bastón.</small>
    </div>
  </div>

  <div class="card">
    <div class="form-group">
      <label for="caravanaInput">Lectura de Caravana / ID:</label>
      <input type="text" id="caravanaInput" placeholder="Escanear o ingresar caravana..." autocomplete="off">
    </div>
    <button class="btn" id="btnAdd">Registrar Caravana</button>
  </div>

  <div class="card">
    <div class="list-header">
      <h3>Lecturas Registradas</h3>
      <span id="totalLecturas">Total: 0</span>
    </div>
    <ul class="item-list" id="lecturasList">
      <li class="empty-msg">No hay caravanas registradas aún.</li>
    </ul>
    <div class="btn-group" style="margin-top: 15px;">
      <button class="btn btn-danger" id="btnClearLocal">Vaciar Base Local</button>
    </div>
  </div>

  <script>window.TAMBO_CONFIG = {"module": "traslado", "db": null, "store": null, "local": true, "worker": "./sw_traslado.js", "clean": false, "endpoint": "https://script.google.com/macros/s/AKfycbxow0pYT8hcOe1YiBdbrpzsGsCfARrE_Tdkr2rkb9d93tIygx34iMJVUdUD5Xnkviwa/exec"};</script>
<script src="../tambo.js?v=20261028.1"></script>
  <script src="../menu-flotante.js?v=20261028.1"></script>
</body>
</html>
