<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Control Brucelosis</title>
  <link rel="manifest" href="./manifest_brucelosis.json">
  <meta name="theme-color" content="#2e7d32">
  <style>
    :root {
      --primary: #2e7d32;
      --primary-dark: #1b5e20;
      --bg: #f4f6f8;
      --card-bg: #ffffff;
      --text: #333333;
      --border: #cccccc;
      --danger: #d32f2f;
      --success: #388e3c;
      --warning: #f57c00;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 15px; max-width: 600px; margin: 0 auto; }
    
    header { background-color: var(--primary); color: white; padding: 15px; border-radius: 10px; text-align: center; margin-bottom: 15px; }
    header h1 { font-size: 1.4rem; margin-bottom: 5px; }
    
    .badge { display: inline-block; padding: 4px 8px; border-radius: 12px; font-size: 0.8rem; font-weight: bold; background: rgba(255,255,255,0.2); }
    
    .btn-install {
      display: none;
      background: #ffffff; color: var(--primary); border: none; padding: 8px 16px;
      border-radius: 20px; font-weight: bold; font-size: 0.85rem; cursor: pointer; margin-top: 10px;
    }

    .card { background: var(--card-bg); padding: 15px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); margin-bottom: 15px; }
    .form-group { margin-bottom: 12px; }
    label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 0.9rem; }
    input[type="text"] { width: 100%; padding: 12px; border: 2px solid var(--border); border-radius: 8px; font-size: 1rem; outline: none; }
    input[type="text"]:focus { border-color: var(--primary); }

    .btn-group { display: flex; gap: 10px; margin-top: 10px; }
    .btn { width: 100%; padding: 12px; background-color: var(--primary); color: white; border: none; border-radius: 8px; font-size: 1rem; font-weight: bold; cursor: pointer; }
    .btn-secondary { background-color: #666; }
    .btn-danger { background-color: var(--danger); }

    .status-bar { display: flex; justify-content: space-between; align-items: center; padding: 10px; background-color: #e8f5e9; border-left: 4px solid var(--success); border-radius: 6px; margin-bottom: 15px; font-size: 0.9rem; }
    .status-offline { background-color: #ffebee; border-left-color: var(--danger); }
    
    .sync-panel { background-color: #fff3e0; border-left: 4px solid var(--warning); padding: 12px; border-radius: 6px; margin-bottom: 15px; font-size: 0.9rem; display: flex; justify-content: space-between; align-items: center; }
    .list-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    ul.item-list { list-style: none; }
    ul.item-list li { background: #fafafa; border: 1px solid #eee; padding: 10px; border-radius: 6px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
    .empty-msg { text-align: center; color: #777; padding: 20px 0; font-size: 0.9rem; }
  </style>
</head>
<body>

  <header>
    <h1>Control Brucelosis</h1>
    <span class="badge" id="appStatus">PWA Web</span><br>
    <button class="btn-install" id="btnInstall">📲 Instalar Aplicación</button>
  </header>

  <div class="status-bar" id="netStatus">
    <span>Estado: <strong id="netText">En Línea</strong></span>
    <span id="syncText">Sincronizado</span>
  </div>

  <div class="sync-panel" id="syncPanel">
    <div><strong>Pendientes de envío:</strong> <span id="pendingCount">0</span></div>
    <button class="btn btn-secondary" id="btnSyncNow" style="width: auto; padding: 6px 14px; font-size: 0.85rem;">Sincronizar</button>
  </div>

  <div class="card">
    <div class="form-group">
      <label for="caravanaInput">Lectura de Caravana / ID:</label>
      <input type="text" id="caravanaInput" placeholder="Escanear o ingresar caravana..." autocomplete="off">
    </div>
    <button class="btn" id="btnAdd">Registrar Brucelosis</button>
  </div>

  <div class="card">
    <div class="list-header">
      <h3>Lecturas Registradas</h3>
      <span id="totalLecturas">Total: 0</span>
    </div>
    <ul class="item-list" id="lecturasList">
      <li class="empty-msg">No hay caravanas registradas aún.</li>
    </ul>
    <div class="btn-group" style="margin-top: 15px;">
      <button class="btn btn-danger" id="btnClearLocal">Vaciar Base Local</button>
    </div>
  </div>

  <script>
    // Registro SW
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw_brucelosis.js')
          .then(() => console.log('SW Brucelosis OK'))
          .catch(err => console.error('Error SW:', err));
      });
    }

    // Instalación PWA
    let deferredPrompt;
    const btnInstall = document.getElementById('btnInstall');
    const appStatus = document.getElementById('appStatus');

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      btnInstall.style.display = 'inline-block';
    });

    btnInstall.addEventListener('click', async () => {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      const { outcome } = await deferredPrompt.userChoice;
      if (outcome === 'accepted') {
        btnInstall.style.display = 'none';
        appStatus.innerText = 'PWA Instalada';
      }
      deferredPrompt = null;
    });

    // Webhook Apps Script
    const WEBHOOK_URL = 'https://script.google.com/macros/s/AKfycbyS9SOX1RtCIoz9RcYnIXQEJYa0g55mKs553drNlwLWCwCbujW3Ir097_0n8ya7_U_z/exec';

    const caravanaInput = document.getElementById('caravanaInput');
    const btnAdd = document.getElementById('btnAdd');
    const btnClearLocal = document.getElementById('btnClearLocal');
    const btnSyncNow = document.getElementById('btnSyncNow');
    const lecturasList = document.getElementById('lecturasList');
    const totalLecturas = document.getElementById('totalLecturas');
    const netStatus = document.getElementById('netStatus');
    const netText = document.getElementById('netText');
    const syncText = document.getElementById('syncText');
    const pendingCount = document.getElementById('pendingCount');

    let lecturas = JSON.parse(localStorage.getItem('brucelosis_lecturas')) || [];
    let colaOffline = JSON.parse(localStorage.getItem('brucelosis_queue')) || [];

    function updateOnlineStatus() {
      if (navigator.onLine) {
        netStatus.classList.remove('status-offline');
        netText.innerText = 'En Línea';
        sincronizarCola();
      } else {
        netStatus.classList.add('status-offline');
        netText.innerText = 'Sin Señal (Modo Offline)';
      }
      updateSyncUI();
    }

    window.addEventListener('online', updateOnlineStatus);
    window.addEventListener('offline', updateOnlineStatus);

    function updateSyncUI() {
      pendingCount.innerText = colaOffline.length;
      if (colaOffline.length > 0) {
        syncText.innerText = 'Pendientes de envío';
        syncText.style.color = 'var(--warning)';
      } else {
        syncText.innerText = 'Sincronizado';
        syncText.style.color = 'var(--success)';
      }
    }

    function renderLecturas() {
      if (lecturas.length === 0) {
        lecturasList.innerHTML = '<li class="empty-msg">No hay caravanas registradas aún.</li>';
        totalLecturas.innerText = 'Total: 0';
        return;
      }

      lecturasList.innerHTML = '';
      lecturas.forEach((item) => {
        const li = document.createElement('li');
        li.innerHTML = `
          <div>
            <strong>${item.caravana}</strong><br>
            <small style="color: #666;">Fecha Control: ${item.fecha} | ${item.hora}</small>
          </div>
          <span style="font-size:0.8rem; font-weight: bold; color: ${item.enviado ? 'green' : 'var(--warning)'};">
            ${item.enviado ? '✓ Enviado' : '⏳ Pendiente'}
          </span>
        `;
        lecturasList.appendChild(li);
      });
      totalLecturas.innerText = `Total: ${lecturas.length}`;
    }

    async function enviarAWebhook(registro) {
      try {
        const formData = new FormData();
        formData.append('accion', 'brucelosis');
        formData.append('caravana', registro.caravana);
        formData.append('fecha', registro.fecha);
        formData.append('hora', registro.hora);

        await fetch(WEBHOOK_URL, {
          method: 'POST',
          mode: 'no-cors',
          body: formData
        });

        return true;
      } catch (e) {
        console.error("Error enviando:", e);
        return false;
      }
    }

    async function registrarCaravana() {
      const caravana = caravanaInput.value.trim();

      if (!caravana) {
        alert('Por favor ingrese el número de Caravana.');
        caravanaInput.focus();
        return;
      }

      const nuevoRegistro = {
        id: Date.now(),
        caravana: caravana,
        fecha: new Date().toLocaleDateString('es-AR'),
        hora: new Date().toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit' }),
        enviado: false
      };

      if (navigator.onLine) {
        const enviadoOk = await enviarAWebhook(nuevoRegistro);
        if (enviadoOk) nuevoRegistro.enviado = true;
        else colaOffline.push(nuevoRegistro);
      } else {
        colaOffline.push(nuevoRegistro);
      }

      lecturas.unshift(nuevoRegistro);
      localStorage.setItem('brucelosis_lecturas', JSON.stringify(lecturas));
      localStorage.setItem('brucelosis_queue', JSON.stringify(colaOffline));

      caravanaInput.value = '';
      caravanaInput.focus();
      renderLecturas();
      updateSyncUI();
    }

    async function sincronizarCola() {
      if (colaOffline.length === 0 || !navigator.onLine) return;

      const colaCopia = [...colaOffline];
      for (const item of colaCopia) {
        const exito = await enviarAWebhook(item);
        if (exito) {
          const idx = lecturas.findIndex(l => l.id === item.id);
          if (idx !== -1) lecturas[idx].enviado = true;
          colaOffline = colaOffline.filter(q => q.id !== item.id);
        }
      }

      localStorage.setItem('brucelosis_lecturas', JSON.stringify(lecturas));
      localStorage.setItem('brucelosis_queue', JSON.stringify(colaOffline));
      renderLecturas();
      updateSyncUI();
    }

    function vaciarBaseLocal() {
      if (confirm('¿Vaciar todas las lecturas guardadas localmente?')) {
        localStorage.removeItem('brucelosis_lecturas');
        localStorage.removeItem('brucelosis_queue');
        lecturas = [];
        colaOffline = [];
        renderLecturas();
        updateSyncUI();
      }
    }

    btnAdd.addEventListener('click', registrarCaravana);
    caravanaInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') registrarCaravana(); });
    btnSyncNow.addEventListener('click', sincronizarCola);
    btnClearLocal.addEventListener('click', vaciarBaseLocal);

    updateOnlineStatus();
    renderLecturas();
  </script>
</body>
</html>
